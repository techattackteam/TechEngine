# TechEngine CI — the enforcement layer (ADR-008 §9). Nothing in ADR-008 is real
# unless a red check here blocks the merge.
#
# Legs (ADR-005/008): Win-MSVC + Linux-Clang, each {Debug, Release}; format on Linux;
# clang-tidy on the Linux leg; sanitizers per-PR (Option A) — ASan/Win, UBSan+TSan/Linux.
# Stage order per leg (fail cheap first): format/tidy -> build -> ctest (incl. sdk-smoke).
#
# Caching: ccache caches BOTH our + dependency compilation on every leg, so pinned deps
# aren't rebuilt each run. ccache is a compiler *launcher*, which needs Ninja (the VS
# generator ignores it) — hence Ninja Multi-Config on Windows (ADR-008 §3 Amended) with
# /Z7 embedded debug info (compiler caches can't cache /Zi PDBs). ccache degrades to
# uncached compilation if its backend is down, so a cache outage never fails the build.
#
# NOTE: the ccache wiring is verified by its first PR run, not locally. The Ninja
# generator + MSVC flags themselves are verified locally.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- cheapest gate first: formatting ---------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==19.1.5
      - name: Check formatting
        run: |
          find engine apps sdk \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      # A macro has no access control and `internal::` is a convention, not a boundary — so
      # the boundary is a red check. Anything reaching into another module's plumbing fails
      # here. Sibling of the te_sdk_smoke leak gate (ADR-008 §7): make the rule structural.
      - name: No reaching into private plumbing
        run: |
          set -o pipefail
          # <owning dir>:<pattern> — the pattern is legal ONLY inside the owning dir.
          violations=0
          check() {
            owner="$1"; pattern="$2"; label="$3"
            hits=$(grep -rnE "$pattern" engine apps sdk \
                     --include='*.cpp' --include='*.hpp' \
                   | grep -v "^$owner" || true)
            if [ -n "$hits" ]; then
              echo "::error::$label is private to $owner — use the public API instead:"
              echo "$hits"
              violations=1
            fi
          }
          check 'engine/base/' 'TE_LOG_PRIVATE_' 'TE_LOG_PRIVATE_* (call TE_LOGGER_<LEVEL>)'
          check 'engine/base/' '\binternal::log' 'TechEngine::internal log plumbing'
          # Two ADR-013 rules at once. Every call site spelling TE_PROFILER_* is what keeps
          # swapping the backend a one-header edit; banning ZoneTransient here is v1's F19
          # (runtime-named zones on a per-frame path) made structural instead of review-only.
          # This is the only gate on either — CI never compiles TE_PROFILE=ON.
          check 'engine/base/include/TechEngine/base/diagnostics/' \
                'ZoneScoped|ZoneTransient|FrameMark|Tracy(Secure)?(Alloc|Free)|tracy/' \
                'Tracy identifiers (call TE_PROFILER_*)'
          exit $violations

  # --- build + test on both legs x {Debug, Release} --------------------------
  build-test:
    name: ${{ matrix.name }}
    # Gated behind the two cheap checks so a formatting slip or an under-covered diff never
    # pays for seven more legs, three of them Windows at 2x (ADR-008 §9's cost trigger).
    #
    # GOTCHA: coverage is pull_request-only, so a push to master SKIPS it, and a skipped
    # dependency skips everything downstream by default. That would kill the master
    # backstop silently. Hence the explicit result checks: skipped is fine here, failed
    # is not. !cancelled() is what stops GitHub applying its own implicit success() gate.
    needs: [format, coverage]
    if: >-
      ${{ !cancelled()
          && needs.format.result == 'success'
          && needs.coverage.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "win-msvc Debug",      os: windows-2022,  preset: windows,       build: windows-debug,   test: windows-debug,   tidy: "OFF" }
          - { name: "win-msvc Release",    os: windows-2022,  preset: windows,       build: windows-release, test: windows-release, tidy: "OFF" }
          - { name: "linux-clang Debug",   os: ubuntu-latest, preset: linux-debug,   build: linux-debug,     test: linux-debug,     tidy: "ON" }
          - { name: "linux-clang Release", os: ubuntu-latest, preset: linux-release, build: linux-release,   test: linux-release,   tidy: "ON" }
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      # Ninja on Windows uses cl.exe from the MSVC environment; this puts it on PATH.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install clang + GLFW deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy \
            xorg-dev libgl1-mesa-dev libwayland-bin libwayland-dev libxkbcommon-dev

      # ccache degrades gracefully: a cold/unreachable cache just compiles slower,
      # it never fails a compile (unlike sccache-as-launcher gating on a live backend).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.build }}

      # Share FetchContent downloads across runs (avoids re-cloning deps each run).
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
          -DTE_ENABLE_CLANG_TIDY=${{ matrix.tidy }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}

      - name: Test (ctest incl. sdk-smoke)
        run: ctest --preset ${{ matrix.test }}

      - name: ccache stats
        run: ccache -s

  # --- diff coverage (S4-P3) -------------------------------------------------
  # Required, and enforced on CHANGED lines rather than the whole project: a global
  # threshold would fall every time `client` grows, because rendering is proven by demo
  # scenes and not unit tests, and a gate that is bypassed weekly teaches nothing.
  #
  # The job runs on every PR and ALWAYS reports, even when bypassed. A required check that
  # is skipped by an `if:` never reports its context at all, which leaves the PR pending
  # forever rather than mergeable. So the bypass lives inside the job: `[skip-coverage]` in
  # the PR description prints the number and exits 0 instead of failing the threshold.
  coverage:
    name: diff coverage
    needs: format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff_coverage.py diffs against the merge base

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      # `llvm` carries llvm-profdata and llvm-cov, which must match clang's major version.
      - name: Install clang + LLVM + GLFW deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm             xorg-dev libgl1-mesa-dev libwayland-bin libwayland-dev libxkbcommon-dev

      # Pinned like clang-format is: the threshold is a merge gate, so the tool that
      # computes it does not get to change under us.
      - run: pipx install diff-cover==10.5.1

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-coverage

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}

      - name: Configure
        run: >
          cmake --preset linux-coverage
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-coverage

      # Identical to the local command. Threshold, base ref, the bypass and the summary
      # path all come from the environment, so nothing about the job diverges from a
      # developer run.
      - name: Coverage
        env:
          TE_COVERAGE_BASE: origin/${{ github.base_ref }}
          TE_COVERAGE_THRESHOLD: "85"
          TE_COVERAGE_BYPASS: ${{ contains(github.event.pull_request.body, '[skip-coverage]') && '1' || '' }}
        run: cmake --build --preset linux-coverage --target coverage

      - name: Upload the browsable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/linux-coverage/coverage/html
          retention-days: 7

      - name: ccache stats
        run: ccache -s

  # --- sanitizers, all per-PR (ADR-008 §9 Option A) --------------------------
  sanitizers:
    name: ${{ matrix.name }}
    # PR-only (ADR-008 §9 Option A / ADR-009 §4): a squash-merge to master was already
    # sanitized on its up-to-date PR, so the push backstop skips the sanitizer trio.
    needs: [format, coverage]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'pull_request'
          && needs.format.result == 'success'
          && needs.coverage.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "win ASan",    os: windows-2022,  preset: windows-asan, build: windows-asan, test: windows-asan }
          - { name: "linux UBSan", os: ubuntu-latest, preset: linux-ubsan,  build: linux-ubsan,  test: linux-ubsan }
          - { name: "linux TSan",  os: ubuntu-latest, preset: linux-tsan,   build: linux-tsan,   test: linux-tsan }
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      # Also puts clang_rt.asan_dynamic-x86_64.dll on PATH so ASan exes start under ctest.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install clang + GLFW deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang \
            xorg-dev libgl1-mesa-dev libwayland-bin libwayland-dev libxkbcommon-dev

      # ccache degrades gracefully: a cold/unreachable cache just compiles slower,
      # it never fails a compile (unlike sccache-as-launcher gating on a live backend).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.build }}

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}

      - name: Test
        run: ctest --preset ${{ matrix.test }}

      - name: ccache stats
        run: ccache -s
