# TechEngine CI — the docs-only stand-in (S4-P4). Partner to ci.yml, which carries the
# "no code" scope rule and the real jobs.
#
# WHY THIS FILE EXISTS: a workflow skipped by a path filter never reports its contexts, and
# a required context that never reports leaves the PR pending forever rather than mergeable.
# So when ci.yml opts out, something else has to report the same nine names. That is this.
#
# WHY NOT AN `if:` ON THE REAL JOBS: measured on the push run for #49, where `coverage` and
# `sanitizers` were both skipped by their `if:`. A skipped plain job does report its context
# (`diff coverage` came back `skipped`). A skipped MATRIX job does not expand: `sanitizers`
# reported one check literally named `matrix.name`, and `win ASan` / `linux UBSan` /
# `linux TSan` never reported at all. Seven of the nine required contexts are matrix legs,
# so gating with `if:` would hang every docs-only PR.
#
# GOTCHA — the names below are load-bearing. A required status check matches on the context
# string, so each entry must equal a `name:` ci.yml produces, character for character. Rename
# a leg there and this file silently stops covering it; the failure shows up as a docs PR
# that will not merge. The list is the ruleset's, verified against
# `gh api repos/:owner/:repo/rulesets/<id>`.
#
# HOW THE SCOPE SPLIT WORKS, and why there is no `paths:` filter here. Actions has no "all
# changed files match" filter, so `paths:` fired whenever ANY changed file matched. A mixed PR
# (docs + code) therefore triggered BOTH workflows and both reported the same nine contexts;
# the merge box took whichever landed last, which was ordering and not a guarantee. Fixed
# 2026-08-29: the `scope` job reads the real diff and `stand-in` is gated on it, so exactly one
# of the two workflows ever reports. A skipped MATRIX job never expands its contexts (see
# above), which is precisely what a code PR needs from this file — silence.

name: CI (docs-only)

# Widened to `.github/workflows/**` on 2026-08-28, so a CI-config-only PR draws no build.
# That also means THIS file stops being tested by its own PR: get a context name below wrong
# and the very PR that broke it still reports nine green. See ci.yml's header.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The third copy of the no-code list, and the only one that is not a `paths` block. It must
  # stay identical to ci.yml's two `paths-ignore` lists: Actions has no YAML anchors.
  scope:
    name: no-code scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base has to be reachable

      # Fails toward `false`, which is the safe direction. A wrong `false` reports nothing
      # here and ci.yml reports the nine real results, or the PR hangs pending and someone
      # looks. A wrong `true` hands out nine green checks for code nobody built.
      - id: check
        env:
          TE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          if ! git rev-parse --verify --quiet "${TE_BASE}^{commit}" >/dev/null \
             || ! git rev-parse --verify --quiet "${TE_HEAD}^{commit}" >/dev/null; then
            echo "::notice::Cannot resolve ${TE_BASE}..${TE_HEAD} — treating this as code."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$TE_BASE" "$TE_HEAD")
          files=$(git diff --name-only "$base" "$TE_HEAD")
          echo "Changed files:"
          echo "$files"
          code=$(echo "$files" | grep -vE '(\.md$|^\.claude/|^\.github/workflows/)' || true)
          if [ -z "$files" ] || [ -n "$code" ]; then
            echo "::notice::Code in this change — ci.yml is the reporter, standing down."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No code in this change — standing in for the nine contexts."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  stand-in:
    name: ${{ matrix.context }}
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - clang-format
          - win-msvc Debug
          - win-msvc Release
          - linux-clang Debug
          - linux-clang Release
          - win ASan
          - linux UBSan
          - linux TSan
          - diff coverage
    steps:
      - name: No code in this change
        run: echo "Docs-only change — '${{ matrix.context }}' has nothing to build."
