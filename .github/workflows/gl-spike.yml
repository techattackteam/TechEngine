# S11-D1's throwaway probe. Never merged: delete before any PR from this branch.
# It builds nothing. Each variant asks GLFW for a hidden 4.6 core context and reports the
# renderer, the version and whether ARB_bindless_texture is there. A variant never fails the job,
# so one push reports every variant; the job summary holds the table.

name: GL spike

on:
  push:
    branches: ['S11-D1/**']

jobs:
  linux:
    name: probe (Linux)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mesa, lavapipe, Xvfb and the probe's GLFW
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools xvfb xauth
          python -m pip install glfw==2.7.0
      - name: Versions
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          dpkg -s libgl1-mesa-dri | grep '^Version'
          ls /usr/share/vulkan/icd.d/
          vulkaninfo --summary || true
          find /usr/lib -name 'zink_dri.so' -o -name 'libgallium*.so' | head
      - name: Probe each variant
        env:
          PYGLFW_LIBRARY_VARIANT: x11
          LVP: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          echo '| Variant | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          probe() {
            name="$1"; shift
            echo "::group::$name ($*)"
            env "$@" xvfb-run -a -s '-screen 0 1280x720x24' \
              python .github/spike/gl_probe.py > "out-$name.txt" 2>&1 || true
            cat "out-$name.txt"
            echo "::endgroup::"
            result=$(grep '^SUMMARY' "out-$name.txt" | head -1 | sed 's/^SUMMARY //' || true)
            echo "| linux $name | ${result:-crashed, see log} |" >> "$GITHUB_STEP_SUMMARY"
          }
          # zink takes a CPU Vulkan device only when LIBGL_ALWAYS_SOFTWARE is set ("failed to
          # choose pdev" otherwise), so every zink variant this round sets it.
          ZINK="LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=zink VK_DRIVER_FILES=$LVP MESA_DEBUG=1 LIBGL_DEBUG=verbose"
          probe zink-swrast-glx   $ZINK
          probe zink-swrast-egl   $ZINK GL_PROBE_EGL=1
          probe zink-swrast-dri2  $ZINK LIBGL_KOPPER_DRI2=1
          probe llvmpipe-egl      LIBGL_ALWAYS_SOFTWARE=1 GL_PROBE_EGL=1
      # Off X entirely: can zink over lavapipe make a context, and does it offer bindless?
      - name: Surfaceless EGL capability
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: zink
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          MESA_DEBUG: '1'
          EGL_PLATFORM: surfaceless
        run: |
          eglinfo > eglinfo.txt 2>&1 || true
          grep -nE 'platform|renderer|version string|MESA|error|failed' eglinfo.txt | head -60 || true
          echo "ARB_bindless_texture mentions: $(grep -c 'GL_ARB_bindless_texture' eglinfo.txt || true)"

  windows:
    name: probe (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install glfw==2.7.0
      # Same archive and hash as .github/scripts/Setup-Mesa.ps1. GLFW loads opengl32.dll by
      # name, so Mesa's copy goes beside python.exe, which the loader searches first.
      - name: Deploy Mesa beside python.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '26.2.0'
          $expectedHash = 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expectedHash) { throw 'Mesa archive SHA-256 mismatch' }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          New-Item -ItemType Directory -Path $mesa -Force | Out-Null
          Push-Location $mesa; cmake -E tar xf $archive; Pop-Location
          Get-ChildItem "$mesa/x64" | Select-Object Name, Length | Format-Table -AutoSize
          $pythonDirectory = Split-Path (python -c "import sys; print(sys.executable)")
          foreach ($name in @('opengl32.dll', 'libgallium_wgl.dll', 'dxil.dll')) {
            Copy-Item -LiteralPath (Join-Path $mesa "x64/$name") -Destination $pythonDirectory -Force
          }
          "MESA_X64=$mesa\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "vulkan-1.dll in System32: $(Test-Path C:\Windows\System32\vulkan-1.dll)"
          # zink needs a Vulkan loader, and the runner has none. Unpinned: this only asks
          # whether zink works at all. A winning path pins a version and a hash.
          $runtime = Join-Path $env:RUNNER_TEMP 'vulkan-runtime.zip'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip?u=' -OutFile $runtime
          Write-Host "Vulkan runtime SHA-256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $runtime).Hash)"
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'vulkan-runtime'
          Expand-Archive -LiteralPath $runtime -DestinationPath $runtimeDirectory -Force
          $loaders = @(Get-ChildItem $runtimeDirectory -Recurse -Filter 'vulkan-1.dll')
          $loaders | ForEach-Object { Write-Host "Found: $($_.FullName) $($_.VersionInfo.FileVersion)" }
          $loader = @($loaders | Where-Object { $_.FullName -match 'x64' }) + $loaders | Select-Object -First 1
          Copy-Item -LiteralPath $loader.FullName -Destination $pythonDirectory -Force
          Write-Host "Loader deployed: $($loader.FullName)"
          Get-ChildItem "$mesa/x64" -Filter '*icd*.json' | ForEach-Object { Write-Host "ICD: $($_.FullName)"; Get-Content $_.FullName }
      - name: Probe each variant
        shell: pwsh
        run: |
          # The runner prepends 'stop'; a probe's stderr must not end the step.
          $ErrorActionPreference = 'Continue'
          '| Variant | Result |' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '|---|---|' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $lvp = (Get-ChildItem $env:MESA_X64 -Filter 'lvp_icd*.json' | Select-Object -First 1).FullName
          function Probe($name, [hashtable]$vars) {
            foreach ($key in $vars.Keys) { Set-Item "env:$key" $vars[$key] }
            Write-Host "::group::$name"
            $output = python .github/spike/gl_probe.py 2>&1 | Out-String
            Write-Host $output
            Write-Host '::endgroup::'
            $line = ($output -split "`n" | Where-Object { $_ -like 'SUMMARY*' } | Select-Object -First 1)
            if (-not $line) { $line = 'crashed, see log' } else { $line = $line.Substring(8).Trim() }
            "| windows $name | $line |" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            foreach ($key in $vars.Keys) { Remove-Item "env:$key" -ErrorAction SilentlyContinue }
          }
          # zink takes a CPU Vulkan device only when LIBGL_ALWAYS_SOFTWARE is set.
          Probe 'zink' @{ LIBGL_ALWAYS_SOFTWARE = '1'; GALLIUM_DRIVER = 'zink'; VK_DRIVER_FILES = $lvp; VK_ICD_FILENAMES = $lvp; MESA_DEBUG = '1' }
          Probe 'zink-d3d' @{ D3D_ALWAYS_SOFTWARE = '1'; GALLIUM_DRIVER = 'zink'; VK_DRIVER_FILES = $lvp; VK_ICD_FILENAMES = $lvp; MESA_DEBUG = '1' }
          exit 0

  # The engine's own tests over zink, on the spike branch's Window.cpp (4.6 core through EGL).
  # Steps mirror ci.yml's Linux legs, and caches restore from master without saving.
  engine:
    name: engine tests (${{ matrix.test }}, zink)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-debug, build: linux-debug, test: linux-debug, tidy: "ON" }
          - { preset: linux-tsan,  build: linux-tsan,  test: linux-tsan,  tidy: "OFF" }
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install clang, GLFW deps, EGL and lavapipe
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             clang clang-tidy libgl1-mesa-dev             libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev             libwayland-bin libwayland-dev libxkbcommon-dev             xvfb xauth libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers ccache
      - name: ccache (restore only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: v2-${{ matrix.build }}-${{ hashFiles('cmake/deps.cmake') }}-${{ github.sha }}
          restore-keys: |
            v2-${{ matrix.build }}-${{ hashFiles('cmake/deps.cmake') }}
          append-timestamp: false
          save: false
      - name: FetchContent sources (restore only)
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps
          -DTE_ENABLE_CLANG_TIDY=${{ matrix.tidy }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test under Xvfb over zink
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: zink
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          if [[ '${{ matrix.test }}' == linux-tsan ]]; then
            export LP_NUM_THREADS=0
          fi
          xvfb-run -a -s '-screen 0 1280x720x24' ctest --preset '${{ matrix.test }}' --output-on-failure
      - run: ccache -s
